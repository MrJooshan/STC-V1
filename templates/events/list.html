<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رویدادها | مسیرم معلم</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #f1c40f; --text-dark: #1a2942; --text-light: #7f8c8d; --bg-light: #f5f7fa; --border: #e8ecf1; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-light); color: var(--text-dark); min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 420px; }
        
        .top-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .back-btn { width: 42px; height: 42px; background: white; border: 1px solid var(--border); border-radius: 14px; display: flex; justify-content: center; align-items: center; color: var(--text-dark); text-decoration: none; }
        .back-btn:hover { background: var(--gold); }
        .back-btn svg { width: 22px; height: 22px; }
        .page-title { font-family: 'Lalezar', cursive; font-size: 1.5rem; }
        
        .event-card { background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; text-decoration: none; color: inherit; display: block; }
        .event-image { width: 100%; height: 160px; object-fit: cover; }
        .event-body { padding: 15px; }
        .event-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; }
        .event-date { font-size: 0.75rem; color: var(--text-light); display: flex; align-items: center; gap: 5px; }
        .event-excerpt { font-size: 0.85rem; color: var(--text-light); margin-top: 10px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-header">
            <a href="{% url 'dashboard:home' %}" class="back-btn">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
            </a>
            <h1 class="page-title">رویدادها و اخبار</h1>
        </div>
        
        {% if events %}
            {% for event in events %}
                <a href="{% url 'events:detail' event.pk %}" class="event-card">
                    <img src="{{ event.image.url }}" class="event-image" alt="{{ event.title }}">
                    <div class="event-body">
                        <h3 class="event-title">{{ event.title }}</h3>
                        <div class="event-date">
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            {{ event.created_at|date:"Y/m/d" }}
                        </div>
                        <p class="event-excerpt">{{ event.content }}</p>
                    </div>
                </a>
            {% endfor %}
        {% else %}
            <div class="empty-state">
                <p>هنوز خبری منتشر نشده است.</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
