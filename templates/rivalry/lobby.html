<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>مسابقه ۱v۱ | مسیرم معلم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
    <style>
        :root { --ink:#10264b; --blue:#087cff; --teal:#00d6ae; --gold:#f8c02e; --pink:#d81b74; --muted:#526783; --page-width:420px; }
        * { box-sizing:border-box; margin:0; padding:0; font-family:"Vazirmatn",sans-serif; -webkit-tap-highlight-color:transparent; }
        html { scrollbar-width: thin; scrollbar-color: #087cff #e8f1ff; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: linear-gradient(180deg,#eef6ff,#e0eeff); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg,#36c5ff,#087cff 55%,#00d6ae); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        html, body { height:100%; }
        body { min-height:100vh; min-height:100svh; background:#000; display:flex; justify-content:center; align-items:stretch; overflow-x:hidden; }
        .mobile-shell { position:relative; width:100%; max-width:var(--page-width); min-height:100vh; min-height:100svh; background:#f5f9ff; display:flex; flex-direction:column; overflow-x:hidden; isolation:isolate; }
        .soft-glow { position:absolute; z-index:0; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle,rgba(8,124,255,.20) 0%,rgba(8,124,255,.06) 45%,transparent 70%); filter:blur(24px); top:-120px; right:-120px; pointer-events:none; }
        .soft-glow-bottom { position:absolute; z-index:0; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,rgba(0,214,174,.16) 0%,rgba(0,214,174,.04) 45%,transparent 70%); filter:blur(26px); bottom:-110px; left:-110px; pointer-events:none; }
        .top-header { position:relative; z-index:2; display:flex; align-items:center; gap:12px; padding: max(14px, env(safe-area-inset-top)) 20px 6px; flex:0 0 auto; }
        .back-btn { display:inline-flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:50%; background:#fff; color:var(--blue); text-decoration:none; border:1px solid rgba(8,124,255,.12); box-shadow:0 4px 14px rgba(16,38,75,.08); transition:transform .25s ease, background .25s ease, color .25s ease, box-shadow .25s ease; position:relative; overflow:hidden; flex-shrink:0; }
        .back-btn::before { content:''; position:absolute; inset:0; border-radius:50%; background:linear-gradient(135deg,#36c5ff,#0d7cf5 50%,#00d8b0); opacity:0; transition:opacity .25s ease; z-index:0; }
        .back-btn svg { width:18px; height:18px; position:relative; z-index:1; transform:translateX(-2px); transition:transform .25s ease; }
        .back-btn:hover { color:#fff; transform:translateY(-2px) scale(1.06); box-shadow:0 8px 22px rgba(8,124,255,.28); }
        .back-btn:hover::before { opacity:1; }
        .back-btn:hover svg { transform:translateX(-4px); }
        .page-title { font-family:"Lalezar",sans-serif; font-size:1.3rem; color:var(--ink); flex:1; text-align:center; }
        .content { position:relative; z-index:1; flex:1 1 auto; padding: 10px 20px 20px; display:flex; flex-direction:column; }
        .lobby-screen { background:#fff; border:1px solid rgba(8,124,255,.10); border-radius:24px; padding:32px 22px; text-align:center; box-shadow:0 10px 34px rgba(16,38,75,.08); position:relative; overflow:hidden; }
        .lobby-screen::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(135deg,#ff4d6d,#d81b74 60%,#a8125a); }
        .lobby-screen::after { content:''; position:absolute; bottom:-60px; left:-60px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle,rgba(216,27,116,.10),transparent 70%); pointer-events:none; }
        .lobby-icon { width:90px; height:90px; margin:0 auto 16px; border-radius:24px; background:linear-gradient(135deg,#ff4d6d,#d81b74 60%,#a8125a); display:flex; justify-content:center; align-items:center; color:#fff; font-size:2.2rem; box-shadow:0 12px 30px rgba(216,27,116,.40); position:relative; z-index:1; }
        .lobby-title { font-family:"Lalezar",sans-serif; font-size:1.85rem; margin-bottom:10px; color:var(--ink); position:relative; z-index:1; }
        .lobby-desc { font-size:.88rem; color:var(--muted); margin-bottom:24px; line-height:1.9; position:relative; z-index:1; }
        .rewards-row { display:flex; justify-content:center; gap:10px; margin-bottom:24px; position:relative; z-index:1; }
        .reward-pill { padding:7px 14px; border-radius:999px; font-size:.76rem; font-weight:900; border:1px solid; }
        .reward-win { background:linear-gradient(135deg,rgba(0,214,174,.12),rgba(0,184,148,.05)); color:#00a48a; border-color:rgba(0,214,174,.28); }
        .reward-lose { background:linear-gradient(135deg,rgba(216,27,116,.12),rgba(168,18,90,.05)); color:#a8125a; border-color:rgba(216,27,116,.28); }
        .find-btn { width:100%; padding:17px; background:linear-gradient(135deg,#ff4d6d 0%,#d81b74 55%,#a8125a 100%); color:#fff; border:none; border-radius:999px; font-size:1.05rem; font-weight:900; cursor:pointer; box-shadow:0 12px 30px rgba(216,27,116,.40); transition:transform .22s ease, box-shadow .22s ease; font-family:inherit; position:relative; z-index:1; animation:pulse 2s infinite; }
        .find-btn:hover { transform:translateY(-2px); box-shadow:0 16px 38px rgba(216,27,116,.50); }
        .find-btn:active { transform:scale(.97); }
        .find-btn:disabled { opacity:.6; animation:none; cursor:not-allowed; }
        @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(216,27,116,.45); } 50% { box-shadow:0 0 0 16px rgba(216,27,116,0); } }
        .waiting-msg { display:none; font-size:.94rem; color:var(--blue); font-weight:800; margin-top:18px; animation:blink 1.5s infinite; position:relative; z-index:1; }
        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.5; } }
        .game-screen { display:none; background:#fff; border-radius:24px; padding:22px; box-shadow:0 10px 34px rgba(16,38,75,.08); border:1px solid rgba(8,124,255,.10); position:relative; overflow:hidden; }
        .game-screen::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(135deg,#36c5ff,#0d7cf5 50%,#00d8b0); }
        .players-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:8px; }
        .player-box { display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; min-width:0; }
        .avatar { width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#087cff,#00d6ae); display:flex; justify-content:center; align-items:center; font-weight:900; font-size:1.3rem; color:#fff; border:3px solid #fff; box-shadow:0 6px 18px rgba(8,124,255,.30); overflow:hidden; }
        .avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
        .player-name { font-size:.8rem; font-weight:800; color:var(--ink); text-align:center; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .vs-badge { font-family:"Lalezar",sans-serif; font-size:1.4rem; color:#fff; background:linear-gradient(135deg,#ff4d6d,#d81b74 60%,#a8125a); padding:9px 15px; border-radius:14px; box-shadow:0 8px 22px rgba(216,27,116,.40); flex-shrink:0; }
        .timer-display { text-align:center; font-family:"Lalezar",sans-serif; font-size:2.2rem; color:var(--blue); margin-bottom:18px; font-weight:900; }
        .question-box { background:linear-gradient(135deg,rgba(8,124,255,.05),rgba(0,214,174,.03)); padding:18px; border-radius:16px; margin-bottom:16px; border:1px solid rgba(8,124,255,.10); }
        .question-text { font-size:1.05rem; font-weight:800; line-height:1.8; margin-bottom:18px; color:var(--ink); }
        .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
        .option-btn { padding:14px 10px; background:#fff; border:2px solid rgba(8,124,255,.15); border-radius:13px; cursor:pointer; font-weight:800; font-size:.88rem; transition:.2s ease; font-family:inherit; color:var(--ink); }
        .option-btn:hover { border-color:var(--blue); background:rgba(8,124,255,.05); }
        .option-btn:active { transform:scale(.95); }
        .option-btn:disabled { opacity:.55; cursor:not-allowed; }
        .opponent-status { text-align:center; font-size:.84rem; font-weight:800; color:var(--blue); margin-top:14px; height:20px; }
        .result-screen { display:none; text-align:center; background:#fff; border-radius:24px; padding:34px 22px; box-shadow:0 10px 34px rgba(16,38,75,.08); border:1px solid rgba(8,124,255,.10); position:relative; overflow:hidden; }
        .result-screen::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(135deg,#36c5ff,#0d7cf5 50%,#00d8b0); }
        .result-title { font-family:"Lalezar",sans-serif; font-size:2.2rem; margin-bottom:16px; }
        .result-title.win { color:#00a48a; }
        .result-title.lose { color:#a8125a; }
        .result-btn { padding:15px 40px; background:linear-gradient(135deg,#36c5ff 0%,#0d7cf5 50%,#00d8b0 100%); color:#fff; border:none; border-radius:999px; font-weight:900; font-size:1rem; cursor:pointer; margin-top:18px; box-shadow:0 10px 28px rgba(8,124,255,.35); transition:.22s ease; font-family:inherit; }
        .result-btn:hover { transform:translateY(-2px); box-shadow:0 14px 34px rgba(8,124,255,.45); }
        .result-btn:active { transform:scale(.97); }
        .back-home-link { display:block; margin-top:14px; color:var(--muted); text-decoration:none; font-size:.88rem; font-weight:700; transition:.2s ease; }
        .back-home-link:hover { color:var(--blue); }
        @media (max-width:380px) { .content { padding-inline:16px; } .top-header { padding-inline:16px; } .lobby-title { font-size:1.6rem; } .timer-display { font-size:1.9rem; } }
        @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
    </style>
</head>
<body>
    <div class="mobile-shell">
        <div class="soft-glow" aria-hidden="true"></div>
        <div class="soft-glow-bottom" aria-hidden="true"></div>
        <header class="top-header">
            <a href="{% url 'dashboard:home' %}" class="back-btn" aria-label="بازگشت">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="M9 5l7 7-7 7"/></svg>
            </a>
            <h1 class="page-title">مسابقه زنده</h1>
            <div style="width:42px;"></div>
        </header>
        <main class="content">
            <div class="lobby-screen" id="lobbyScreen">
                <div class="lobby-icon">⚔️</div>
                <h1 class="lobby-title">مسابقه زنده ۱v۱</h1>
                <p class="lobby-desc">
                    به یک حریف واقعی وصل شو!<br>
                    هر سوال ۵۰ ثانیه وقت داره.
                </p>
                <div class="rewards-row">
                    <span class="reward-pill reward-win">برنده: +۴ امتیاز</span>
                    <span class="reward-pill reward-lose">بازنده: −۲ امتیاز</span>
                </div>
                <button class="find-btn" id="findMatchBtn">جستجوی حریف</button>
                <div class="waiting-msg" id="waitingMsg">⏳ در حال جستجوی حریف...</div>
            </div>

            <div class="game-screen" id="gameScreen">
                <div class="players-header">
                    <div class="player-box">
                        <div class="avatar" id="myAvatar">{{ user.first_name|default:user.phone_number|slice:":1" }}</div>
                        <div class="player-name">{{ user.display_name }}</div>
                    </div>
                    <div class="vs-badge">VS</div>
                    <div class="player-box">
                        <div class="avatar" id="opponentAvatar">?</div>
                        <div class="player-name" id="opponentName">در انتظار...</div>
                    </div>
                </div>
                <div class="timer-display" id="timerDisplay">50</div>
                <div class="question-box">
                    <div class="question-text" id="questionText">در حال دریافت سوال...</div>
                    <div class="options-grid" id="optionsGrid"></div>
                </div>
                <div class="opponent-status" id="opponentStatus"></div>
            </div>

            <div class="result-screen" id="resultScreen">
                <h1 class="result-title" id="resultTitle">نتیجه</h1>
                <p id="resultMessage" style="font-size:1rem; color:var(--muted); font-weight:700;"></p>
                <button class="result-btn" onclick="window.location.reload()">بازی مجدد</button>
                <a href="{% url 'dashboard:home' %}" class="back-home-link">بازگشت به خانه</a>
            </div>
        </main>
    </div>

    <script>
        const lobbyScreen = document.getElementById('lobbyScreen');
        const gameScreen = document.getElementById('gameScreen');
        const resultScreen = document.getElementById('resultScreen');
        const findMatchBtn = document.getElementById('findMatchBtn');
        const waitingMsg = document.getElementById('waitingMsg');
        let socket = null;
        let timerInterval = null;
        let currentTimer = 50;

        findMatchBtn.addEventListener('click', () => {
            findMatchBtn.disabled = true;
            waitingMsg.style.display = 'block';
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            socket = new WebSocket(`${protocol}${window.location.host}/ws/rivalry/`);
            socket.onopen = () => socket.send(JSON.stringify({ action: 'find_match' }));
            socket.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'waiting') waitingMsg.textContent = data.message;
                if (data.type === 'match_found') startGame(data);
                if (data.type === 'game_over') showResult(data);
                if (data.type === 'opponent_left') showResult({ type: 'game_over', winner_name: 'شما (حریف خارج شد)', reason: 'disconnect' });
            };
            socket.onclose = () => { if (timerInterval) clearInterval(timerInterval); };
        });

        function startGame(data) {
            lobbyScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            document.getElementById('opponentName').textContent = data.opponent_name;
            if (data.opponent_avatar) {
                document.getElementById('opponentAvatar').innerHTML = `<img src="${data.opponent_avatar}" alt="">`;
            } else {
                document.getElementById('opponentAvatar').textContent = data.opponent_name[0];
            }
            const q = data.question;
            document.getElementById('questionText').textContent = q.text;
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${index + 1}. ${opt}`;
                btn.onclick = () => submitAnswer(index + 1);
                optionsGrid.appendChild(btn);
            });
            startTimer();
        }

        function startTimer() {
            currentTimer = 50;
            document.getElementById('timerDisplay').textContent = currentTimer;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                currentTimer--;
                document.getElementById('timerDisplay').textContent = currentTimer;
                if (currentTimer <= 0) {
                    clearInterval(timerInterval);
                    socket.send(JSON.stringify({ action: 'submit_answer', answer: 0 }));
                }
            }, 1000);
        }

        function submitAnswer(answer) {
            if (timerInterval) clearInterval(timerInterval);
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            document.getElementById('opponentStatus').textContent = '⏳ در حال بررسی...';
            socket.send(JSON.stringify({ action: 'submit_answer', answer: answer }));
        }

        function showResult(data) {
            if (timerInterval) clearInterval(timerInterval);
            gameScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            const title = document.getElementById('resultTitle');
            const msg = document.getElementById('resultMessage');
            if (data.reason === 'timeout') {
                title.textContent = '⏰ زمان تمام شد!';
                title.className = 'result-title lose';
                msg.textContent = 'هیچ‌کس در زمان مقرر جواب نداد.';
            } else if (data.reason === 'answered' || data.reason === 'disconnect') {
                if (data.winner_name === '{{ user.display_name }}' || data.winner_name.includes('شما')) {
                    title.textContent = '🎉 برنده شدی!';
                    title.className = 'result-title win';
                    msg.textContent = '+۴ امتیاز به شما اضافه شد!';
                } else {
                    title.textContent = '😔 باختی!';
                    title.className = 'result-title lose';
                    msg.textContent = '−۲ امتیاز از شما کسر شد.';
                }
            }
            if (socket) socket.close();
        }
    </script>
</body>
</html>
