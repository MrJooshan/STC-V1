<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>در انتظار تایید ادمین | مسیرم معلم</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
    <style>
        :root { --primary-blue: #0a192f; --gold: #f1c40f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--primary-blue); color: white; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        
        .dynamic-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            {% if setting.background_image %} background-image: url('{{ setting.background_image.url }}'); background-size: cover; background-position: center bottom;
            {% else %} background: radial-gradient(circle at top, #1a365d 0%, #0a192f 100%); {% endif %} }
        .bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(10, 25, 47, 0.6) 0%, rgba(10, 25, 47, 0.95) 100%); z-index: -1; }
        
        .app-container { width: 100%; max-width: 420px; padding: 20px; position: relative; z-index: 1; }
        
        .glass-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 40px 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center; animation: zoomIn 0.5s ease-out; }
        
        .icon-box { width: 90px; height: 90px; margin: 0 auto 25px; background: rgba(241, 196, 15, 0.15); border: 2px solid #f1c40f; border-radius: 50%; display: flex; justify-content: center; align-items: center; animation: pulse 2s infinite; }
        .icon-box svg { width: 50px; height: 50px; color: #f1c40f; }
        
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.4); } 50% { box-shadow: 0 0 0 20px rgba(241, 196, 15, 0); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        h2 { font-family: 'Lalezar', cursive; font-size: 2.2rem; color: #f1c40f; margin-bottom: 15px; text-shadow: 0px 2px 0px #b8860b, 0px 4px 0px #8b6508; }
        p { color: #bdc3c7; font-size: 1rem; line-height: 1.8; margin-bottom: 25px; }
        
        .btn-submit { display: inline-block; width: 100%; padding: 16px; background: #f1c40f; color: #2c3e50; border-radius: 50px; font-size: 1.1rem; font-weight: 800; text-decoration: none; box-shadow: 0 6px 15px rgba(241, 196, 15, 0.4); transition: all 0.2s ease; }
        .btn-submit:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <div class="dynamic-bg"></div>
    <div class="bg-overlay"></div>
    <div class="app-container">
        <div class="glass-box">
            <div class="icon-box">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h2>در انتظار تایید ادمین</h2>
            <p>حساب کاربری شما با شماره <strong style="color: #f1c40f;">{{ phone }}</strong> ساخته شده است، اما هنوز توسط ادمین تایید نشده. لطفا کمی صبر کنید، به محض تایید می‌توانید وارد شوید.</p>
            <a href="{% url 'home' %}" class="btn-submit">بازگشت به صفحه اصلی</a>
        </div>
    </div>
</body>
</html>
