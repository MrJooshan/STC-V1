<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>در انتظار تایید ادمین | مسیرم معلم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:#10264b; --blue:#087cff; --teal:#00d6ae; --gold:#f8c02e; --pink:#d81b74; --muted:#526783;
            --grad-btn: linear-gradient(135deg,#36c5ff 0%,#0d7cf5 45%,#00d8b0 100%);
            --radius-btn:999px;
            --page-width:420px;
            --sk-base: rgba(8,124,255,.08); --sk-shine: rgba(8,124,255,.18);
        }
        * { box-sizing:border-box; margin:0; padding:0; font-family:"Vazirmatn",sans-serif; -webkit-tap-highlight-color:transparent; }
        html, body { height:100%; }
        body { min-height:100vh; min-height:100svh; background:#000; display:flex; justify-content:center; align-items:stretch; overflow:hidden; }
        .mobile-shell { position:relative; width:100%; max-width:var(--page-width); min-height:100vh; min-height:100svh; background:#f5f9ff; display:flex; flex-direction:column; overflow:hidden; isolation:isolate; }
        .soft-glow { position:absolute; z-index:0; width:320px; height:320px; border-radius:50%; background:radial-gradient(circle,rgba(248,192,46,.22) 0%,rgba(248,192,46,.06) 45%,transparent 70%); filter:blur(26px); top:-130px; right:-130px; pointer-events:none; animation:glowFloat 8s ease-in-out infinite; }
        .soft-glow-bottom { position:absolute; z-index:0; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle,rgba(0,214,174,.16) 0%,rgba(0,214,174,.04) 45%,transparent 70%); filter:blur(28px); bottom:-120px; left:-120px; pointer-events:none; animation:glowFloat 10s ease-in-out infinite reverse; }
        @keyframes glowFloat { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(-10px,10px) scale(1.08); } }
        .top-header { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:max(14px,env(safe-area-inset-top)) 20px 6px; flex:0 0 auto; }
        .logo-container { width:48px; height:48px; display:flex; justify-content:center; align-items:center; background:#fff; border-radius:14px; border:1px solid rgba(8,124,255,.10); box-shadow:0 4px 14px rgba(16,38,75,.08); flex:0 0 auto; overflow:hidden; }
        .logo-container img { width:62%; height:62%; object-fit:contain; }
        .logo-container svg { width:52%; height:52%; }
        .content { position:relative; z-index:1; flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px max(20px,env(safe-area-inset-left)) max(20px,env(safe-area-inset-bottom)); overflow-y:auto; scrollbar-width:none; min-height:0; }
        .content::-webkit-scrollbar { display:none; }
        .pending-card { width:100%; background:#fff; border-radius:24px; padding:30px 22px; box-shadow:0 15px 40px rgba(16,38,75,.12); text-align:center; position:relative; overflow:hidden; animation:zoomIn .6s cubic-bezier(.34,1.56,.64,1) both; border:1px solid rgba(248,192,46,.15); }
        .pending-card::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg,#f8c02e,#00d6ae,#087cff); border-radius:24px 24px 0 0; }
        @keyframes zoomIn { from { opacity:0; transform:scale(.9) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .icon-box { width:100px; height:100px; margin:0 auto 22px; background:linear-gradient(135deg,rgba(248,192,46,.15),rgba(0,214,174,.10)); border:2px solid rgba(248,192,46,.4); border-radius:50%; display:flex; justify-content:center; align-items:center; color:#d99400; animation:pulseGold 2.2s ease-in-out infinite; position:relative; }
        .icon-box svg { width:50px; height:50px; position:relative; z-index:1; }
        @keyframes pulseGold { 0%,100% { box-shadow:0 0 0 0 rgba(248,192,46,.35); transform:scale(1); } 50% { box-shadow:0 0 0 20px rgba(248,192,46,0); transform:scale(1.04); } }
        .pending-title { font-family:"Lalezar",sans-serif; font-size:1.9rem; color:var(--ink); margin-bottom:12px; letter-spacing:-.5px; }
        .pending-text { font-size:.88rem; color:var(--muted); line-height:1.9; margin-bottom:22px; }
        .pending-text strong { color:#d99400; font-weight:900; background:rgba(248,192,46,.12); padding:2px 8px; border-radius:6px; direction:ltr; display:inline-block; }
        .steps-info { display:flex; flex-direction:column; gap:10px; margin-bottom:24px; text-align:right; background:linear-gradient(135deg,rgba(8,124,255,.04),rgba(0,214,174,.03)); padding:14px 16px; border-radius:14px; border-right:3px solid var(--blue); }
        .step-item { display:flex; align-items:center; gap:10px; font-size:.8rem; color:var(--ink); font-weight:600; }
        .step-num { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:.72rem; flex-shrink:0; color:#fff; }
        .step-num.done { background:linear-gradient(135deg,#00d6ae,#00b894); box-shadow:0 4px 10px rgba(0,214,174,.30); }
        .step-num.current { background:linear-gradient(135deg,#f8c02e,#d99400); box-shadow:0 4px 10px rgba(248,192,46,.35); animation:pulseStep 1.8s ease-in-out infinite; }
        .step-num.wait { background:#e0e6ef; color:var(--muted); }
        @keyframes pulseStep { 0%,100% { transform:scale(1); } 50% { transform:scale(1.10); } }
        .step-item.done .step-label { color:var(--teal); }
        .step-item.current .step-label { color:#b8860b; font-weight:800; }
        .btn-submit { display:inline-flex; justify-content:center; align-items:center; gap:10px; width:100%; min-height:54px; padding:14px 24px; border:none; border-radius:var(--radius-btn); background:var(--grad-btn); color:#fff; font-size:1rem; font-weight:900; text-decoration:none; cursor:pointer; position:relative; isolation:isolate; overflow:hidden; box-shadow:0 12px 28px rgba(0,139,221,.35),0 4px 12px rgba(0,199,183,.25),inset 0 2px 4px rgba(255,255,255,.5); transition:transform .22s,box-shadow .22s,filter .22s; }
        .btn-submit svg { width:20px; height:20px; stroke:currentColor; stroke-width:2.6; order:-1; transition:transform .3s; }
        .btn-submit::before { content:""; position:absolute; z-index:-1; top:-10%; right:-35%; width:55%; height:200%; transform:rotate(28deg); background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent); transition:right .55s; filter:blur(2px); }
        .btn-submit:hover { filter:saturate(1.12) brightness(1.05); }
        .btn-submit:hover::before { right:115%; }
        .btn-submit:hover svg { transform:translateX(-4px); }
        .btn-submit:active { transform:scale(.97); }
        .sk { background:var(--sk-base); border-radius:8px; position:relative; overflow:hidden; }
        .sk::after { content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg,transparent,var(--sk-shine),transparent); animation:skShine 1.4s ease-in-out infinite; }
        @keyframes skShine { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
        .sk-circle-big { width:100px; height:100px; border-radius:50%; margin:0 auto 22px; }
        .sk-title { height:30px; width:70%; margin:0 auto 14px; border-radius:10px; }
        .sk-text { height:14px; width:90%; margin:0 auto 8px; border-radius:7px; }
        .sk-text.short { width:60%; margin-bottom:22px; }
        .sk-steps { height:110px; border-radius:14px; margin-bottom:24px; }
        .sk-btn { width:100%; height:54px; border-radius:var(--radius-btn); }
        .is-loading .real-content { display:none !important; }
        .skeleton-content { display:none; width:100%; }
        .is-loading .skeleton-content { display:block; }
        @media (max-height:700px) { .top-header { padding-top:max(10px,env(safe-area-inset-top)); } .pending-card { padding:22px 18px; } .icon-box { width:80px; height:80px; margin-bottom:16px; } .icon-box svg { width:40px; height:40px; } .pending-title { font-size:1.6rem; } .pending-text { font-size:.82rem; margin-bottom:16px; } .steps-info { padding:12px 14px; margin-bottom:18px; gap:8px; } .btn-submit { min-height:50px; font-size:.94rem; } }
        @media (max-width:380px) { .content { padding-inline:16px; } .top-header { padding-inline:16px; } .pending-title { font-size:1.7rem; } }
        @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } .sk::after { animation:none; } }
    </style>
</head>
<body>
    <div class="mobile-shell" id="mobileShell">
        <div class="soft-glow" aria-hidden="true"></div>
        <div class="soft-glow-bottom" aria-hidden="true"></div>
        <header class="top-header">
            <div class="logo-container">
                {% if setting.logo %}
                    <img src="{{ setting.logo.url }}" alt="لوگو">
                {% else %}
                    <svg viewBox="0 0 24 24" fill="none" stroke="url(#logoGrad)" stroke-width="1.8">
                        <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#36C5FF"/><stop offset="50%" stop-color="#0D7CF5"/><stop offset="100%" stop-color="#00D8B0"/></linearGradient></defs>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                {% endif %}
            </div>
        </header>
        <main class="content">
            <div class="skeleton-content" aria-hidden="true">
                <div class="sk sk-circle-big"></div>
                <div class="sk sk-title"></div>
                <div class="sk sk-text"></div>
                <div class="sk sk-text"></div>
                <div class="sk sk-text short"></div>
                <div class="sk sk-steps"></div>
                <div class="sk sk-btn"></div>
            </div>
            <div class="real-content" style="width:100%;">
                <div class="pending-card">
                    <div class="icon-box">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                    <h2 class="pending-title">در انتظار تایید ادمین</h2>
                    <p class="pending-text">
                        حساب کاربری شما با شماره <strong>{{ phone }}</strong> ساخته شده است، اما هنوز توسط ادمین تایید نشده.
                        <br>
                        لطفاً کمی صبر کنید، به محض تایید می‌توانید وارد شوید.
                    </p>
                    <div class="steps-info">
                        <div class="step-item done">
                            <span class="step-num done">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                            </span>
                            <span class="step-label">ثبت نام انجام شد</span>
                        </div>
                        <div class="step-item current">
                            <span class="step-num current">2</span>
                            <span class="step-label">در حال بررسی توسط ادمین</span>
                        </div>
                        <div class="step-item">
                            <span class="step-num wait">3</span>
                            <span class="step-label">فعال‌سازی و ورود</span>
                        </div>
                    </div>
                    <a href="{% url 'home' %}" class="btn-submit">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                        <span>بازگشت به صفحه اصلی</span>
                    </a>
                </div>
            </div>
        </main>
    </div>
    <script>
    (function(){
        const shell = document.getElementById('mobileShell');
        shell.classList.add('is-loading');
        function hideSkeleton(){ shell.classList.remove('is-loading'); }
        if (document.readyState === 'complete') setTimeout(hideSkeleton, 500);
        else window.addEventListener('load', () => setTimeout(hideSkeleton, 500));
    })();
    </script>
</body>
</html>
