<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تیکت جدید | مسیرم معلم</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #f1c40f; --text-dark: #1a2942; --text-light: #7f8c8d; --bg-light: #f5f7fa; --border: #e8ecf1; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-light); color: var(--text-dark); min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 420px; }
        .top-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .back-btn { width: 42px; height: 42px; background: white; border: 1px solid var(--border); border-radius: 14px; display: flex; justify-content: center; align-items: center; color: var(--text-dark); text-decoration: none; }
        .back-btn:hover { background: var(--gold); }
        .back-btn svg { width: 22px; height: 22px; }
        .page-title { font-family: 'Lalezar', cursive; font-size: 1.5rem; }
        .form-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; }
        .form-input { width: 100%; padding: 14px 15px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-light); outline: none; font-family: inherit; font-size: 0.9rem; resize: vertical; }
        .form-input:focus { border-color: var(--gold); background: white; box-shadow: 0 0 0 3px rgba(241,196,15,0.2); }
        textarea.form-input { min-height: 140px; line-height: 1.7; }
        .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--gold), #f39c12); color: var(--text-dark); border: none; border-radius: 50px; font-size: 1rem; font-weight: 800; cursor: pointer; box-shadow: 0 6px 20px rgba(241,196,15,0.4); transition: 0.3s; margin-top: 10px; }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-header">
            <a href="{% url 'accounts:ticket_list' %}" class="back-btn">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
            </a>
            <h1 class="page-title">تیکت جدید</h1>
        </div>
        
        <div class="form-card">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>موضوع</label>
                    {{ form.subject }}
                </div>
                <div class="form-group">
                    <label>پیام</label>
                    {{ form.message }}
                </div>
                <button type="submit" class="btn">ارسال به مدیر</button>
            </form>
        </div>
    </div>
</body>
</html>
