<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#dceefc">
    <title>{{ setting.site_title|default:"باشگاه دانشجومعلمان" }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #10264b;
            --blue: #087cff;
            --page-width: 480px;
            --btn-radius: 999px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Vazirmatn", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
            background: #dceefc;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            color: var(--ink);
            background:
                radial-gradient(ellipse at 50% 8%, rgba(255,255,255,.85), transparent 52%),
                linear-gradient(145deg, #eef7ff 0%, #dceefc 48%, #ddfaf2 100%);
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }

        /* ===================== لودینگ ===================== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background: radial-gradient(ellipse at 50% 40%, #f4fbff 0%, #e2f1fd 60%, #d6ecfb 100%);
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-ring {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 4px solid rgba(8, 124, 255, 0.15);
            border-top-color: #087cff;
            border-right-color: #08c9e8;
            animation: spin 1s cubic-bezier(.6, .2, .4, .8) infinite;
            box-shadow: 0 0 24px rgba(8, 124, 255, 0.25);
        }

        .loader-text {
            font-size: 1rem;
            font-weight: 800;
            color: #1a3a6b;
            letter-spacing: .5px;
            animation: pulseText 1.6s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* پس‌زمینه */
        .dynamic-bg {
            position: fixed;
            z-index: 0;
            inset: 0;
            width: min(100%, var(--page-width));
            margin-inline: auto;
            background-color: #e3f0fb;
            background-image:
                {% if setting.background_image %}
                url('{{ setting.background_image.url }}'),
                {% endif %}
                radial-gradient(circle at 82% 13%, rgba(30, 174, 255, .18), transparent 31%),
                radial-gradient(circle at 12% 80%, rgba(0, 211, 177, .15), transparent 32%),
                linear-gradient(155deg, #f4fbff 0%, #e2f1fd 55%, #e4faf2 100%);
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            pointer-events: none;
        }

        .bg-overlay {
            position: fixed;
            z-index: 1;
            inset: 0;
            width: min(100%, var(--page-width));
            margin-inline: auto;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,.02) 0%, rgba(255,255,255,.06) 50%, rgba(220,238,252,.18) 100%),
                radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(255,255,255,.08) 100%);
        }

        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: var(--page-width);
            min-height: 100vh;
            min-height: 100svh;
            margin: 0 auto;
            padding:
                max(24px, env(safe-area-inset-top))
                25px
                max(22px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            isolation: isolate;
        }

        .ambient-glow {
            position: absolute;
            z-index: -1;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            filter: blur(42px);
            opacity: .22;
            pointer-events: none;
        }
        .ambient-glow.one { top: 13%; right: -115px; background: #38bdf8; }
        .ambient-glow.two { bottom: 10%; left: -120px; background: #18d6b0; }

        /* ===================== هیرو ===================== */
        .hero-section {
            flex: 1 0 auto;
            width: 100%;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 0 28px;
        }

        /* ==========================================================
           تایتل — بازنویسی کامل از صفر
           روش: رنگ توپر طلایی + outline مشکی با text-shadow چهارجهته
           + سایه 3D چندلایه پایین. بدون background-clip و بدون
           -webkit-text-stroke تا در همه مرورگرها یکسان باشد.
           ========================================================== */
        .main-title {
            position: relative;
            font-family: "Lalezar", "Vazirmatn", sans-serif;
            font-size: clamp(2.6rem, 10.5vw, 3.5rem);
            font-weight: 400;
            line-height: 1.25;
            letter-spacing: -.3px;
            margin-bottom: 26px;
            color: #f8c02e; /* طلایی ملایم */
            text-align: center;
            text-shadow:
                /* outline مشکی چهارجهته (به‌جای stroke) */
                -1px -1px 0 #1a1a1a,
                 1px -1px 0 #1a1a1a,
                -1px  1px 0 #1a1a1a,
                 1px  1px 0 #1a1a1a,
                 0   -1.5px 0 #1a1a1a,
                 0    1.5px 0 #1a1a1a,
                -1.5px 0   0 #1a1a1a,
                 1.5px 0   0 #1a1a1a,
                /* سایه 3D عمودی */
                 0  3px 0 #141414,
                 0  5px 0 #0f0f0f,
                 0  7px 0 #0a0a0a,
                 0  9px 0 #050505,
                /* سایه نرم زیر */
                 0 12px 14px rgba(0, 0, 0, 0.35);
            animation: fadeInUp .9s cubic-bezier(.16, 1, .3, 1) .08s both;
            -webkit-font-smoothing: antialiased;
        }

        .main-title::after {
            content: "";
            display: block;
            width: 68%;
            height: 3px;
            margin: 16px auto 0;
            border-radius: 10px;
            background: linear-gradient(90deg, transparent, #1a1a1a 20%, #f8c02e 50%, #1a1a1a 80%, transparent);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: #1a1a1a;
            font-size: clamp(1.12rem, 4.5vw, 1.38rem);
            font-weight: 900;
            line-height: 1.8;
            margin-bottom: 7px;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.9);
            animation: fadeInUp .9s cubic-bezier(.16, 1, .3, 1) .22s both;
        }

        .features {
            color: #2a2a2a;
            font-size: clamp(.9rem, 3.7vw, 1.05rem);
            font-weight: 800;
            line-height: 1.9;
            text-shadow: 0 1px 5px rgba(255, 255, 255, 0.95);
            animation: fadeInUp .9s cubic-bezier(.16, 1, .3, 1) .36s both;
        }

        .features span { color: #087cff; margin: 0 2px; }

        /* ===================== پایین ===================== */
        .bottom-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            padding-bottom: 5px;
            animation: fadeInUp .9s cubic-bezier(.16, 1, .3, 1) .5s both;
        }

        .btn-primary {
            position: relative;
            isolation: isolate;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 68px;
            padding: 16px 22px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.75);
            border-radius: var(--btn-radius);
            background: linear-gradient(180deg, #36c5ff 0%, #0d7cf5 40%, #00d8b0 100%);
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 900;
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.08),
                0 13px 28px rgba(0, 139, 221, 0.35),
                0 4px 12px rgba(0, 199, 183, 0.25),
                inset 0 2px 4px rgba(255, 255, 255, 0.7),
                inset 0 -6px 12px rgba(0, 70, 130, 0.35),
                0 0 30px rgba(0, 180, 255, 0.25);
            transition: transform .22s ease, box-shadow .22s ease, filter .22s ease;
            animation: btnGlow 3s ease-in-out infinite;
        }

        .btn-primary svg {
            width: 26px;
            height: 26px;
            flex: 0 0 auto;
            stroke: currentColor;
            stroke-width: 2.6;
            order: -1;
            animation: arrowBounce 2.4s ease-in-out infinite;
        }

        .btn-primary span {
            letter-spacing: .5px;
            text-shadow: 0 2px 3px rgba(0, 60, 100, 0.3);
        }

        .btn-primary::before {
            content: "";
            position: absolute;
            z-index: -1;
            top: -10%;
            right: -35%;
            width: 55%;
            height: 200%;
            transform: rotate(28deg);
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: right .55s ease;
            filter: blur(2px);
        }

        .btn-primary::after {
            content: "";
            position: absolute;
            top: 5px;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
            border-radius: 50%;
            opacity: 0.8;
        }

        .btn-primary:hover {
            filter: saturate(1.15) brightness(1.05);
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.1),
                0 16px 34px rgba(0, 139, 221, 0.4),
                0 5px 15px rgba(0, 199, 183, 0.3),
                inset 0 2px 4px rgba(255, 255, 255, 0.8),
                inset 0 -6px 12px rgba(0, 70, 130, 0.4),
                0 0 50px rgba(0, 200, 255, 0.35);
        }

        .btn-primary:hover::before { right: 115%; }
        .btn-primary:active { transform: scale(.97); }

        .register-link {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            width: 100%;
            color: #1a1a1a;
            text-decoration: none;
            text-align: center;
            font-size: .98rem;
            font-weight: 800;
            line-height: 1.8;
            text-shadow: 0 1px 5px rgba(255, 255, 255, 0.95);
        }

        .register-link::before,
        .register-link::after {
            content: "";
            flex: 1 1 18px;
            max-width: 58px;
            height: 2px;
            border-radius: 5px;
            background: linear-gradient(90deg, transparent, rgba(20, 40, 80, 0.35));
        }
        .register-link::after { transform: rotate(180deg); }

        .register-link span {
            color: #d81b74;
            font-weight: 900;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.9);
        }
        .register-link:hover span { color: #a8125a; }

        /* ==========================================================
           MARQUEE — بازنویسی کامل از صفر
           ساختار:
             .marquee-wrapper (کادر، overflow hidden، direction LTR)
               .marquee-track (flex، دو نسخه محتوا، انیمیشن translate3d)
                 .marquee-group (نسخه ۱، direction RTL)
                 .marquee-group (نسخه ۲، direction RTL، aria-hidden)
           چرا کار می‌کند:
             - track در LTR است تا translate3d(-50%) به چپ حرکت کند
             - هر group در RTL است تا متن فارسی درست بچیند
             - دو نسخه یکسان → در -50% نسخه۲ دقیقاً جای نسخه۱ می‌نشیند
             - width: max-content روی هر دو → عرض واقعی حفظ می‌شود
           ========================================================== */
        .marquee-wrapper {
            position: relative;
            width: 100%;
            min-height: 58px;
            margin-top: clamp(12px, 3vh, 26px);
            display: flex;
            align-items: center;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.75);
            border-radius: var(--btn-radius);
            background: linear-gradient(180deg, #9b4ddb 0%, #6a2caf 45%, #4a1a8a 100%);
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.05),
                0 10px 28px rgba(77, 36, 143, 0.3),
                inset 0 2px 2px rgba(255, 255, 255, 0.5),
                inset 0 -5px 10px rgba(30, 10, 60, 0.4),
                0 0 25px rgba(130, 60, 200, 0.2);
            direction: ltr; /* برای جهت انیمیشن — حیاتی */
        }

        .marquee-wrapper::before {
            content: "";
            position: absolute;
            top: 3px; left: 10%; right: 10%; height: 1px;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
            border-radius: 50%;
        }
        .marquee-wrapper::after {
            content: "";
            position: absolute;
            bottom: 3px; left: 15%; right: 15%; height: 1px;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 50%;
        }

        .marquee-fade {
            position: absolute;
            top: 0; bottom: 0;
            width: 30px;
            z-index: 3;
            pointer-events: none;
        }
        .marquee-fade.left  { left: 0;  background: linear-gradient(90deg,  #6a2caf, transparent); }
        .marquee-fade.right { right: 0; background: linear-gradient(270deg, #5a2599, transparent); }

        .marquee-track {
            display: flex;
            flex-wrap: nowrap;
            width: max-content;
            min-width: max-content;
            will-change: transform;
            animation: marqueeMove 38s linear infinite;
            animation-fill-mode: both;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
        }

        .marquee-wrapper:hover .marquee-track,
        .marquee-wrapper:focus-within .marquee-track {
            animation-play-state: paused;
        }

        .marquee-group {
            display: flex;
            flex-wrap: nowrap;
            flex: 0 0 auto;
            width: max-content;
            direction: rtl; /* متن فارسی درست */
        }

        .marquee-item {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
            padding: 0 25px;
            color: #ffffff;
            font-size: .91rem;
            font-weight: 700;
            white-space: nowrap;
            text-shadow:
                0 1px 0 #3a1060,
                0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .marquee-item .spark {
            color: #ffd966;
            font-size: 1.1rem;
            flex: 0 0 auto;
            filter: drop-shadow(0 0 6px rgba(255, 220, 120, 0.7));
        }

        /* انیمیشن marquee */
        @keyframes marqueeMove {
            from { transform: translate3d(0, 0, 0); }
            to   { transform: translate3d(-50%, 0, 0); }
        }

        /* انیمیشن‌های عمومی */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes btnGlow {
            0%, 100% {
                box-shadow:
                    0 0 0 1px rgba(0, 0, 0, 0.08),
                    0 13px 28px rgba(0, 139, 221, 0.35),
                    0 4px 12px rgba(0, 199, 183, 0.25),
                    inset 0 2px 4px rgba(255, 255, 255, 0.7),
                    inset 0 -6px 12px rgba(0, 70, 130, 0.35),
                    0 0 30px rgba(0, 180, 255, 0.25);
            }
            50% {
                box-shadow:
                    0 0 0 1px rgba(0, 0, 0, 0.08),
                    0 13px 28px rgba(0, 139, 221, 0.45),
                    0 4px 12px rgba(0, 199, 183, 0.35),
                    inset 0 2px 4px rgba(255, 255, 255, 0.75),
                    inset 0 -6px 12px rgba(0, 70, 130, 0.4),
                    0 0 45px rgba(0, 200, 255, 0.45);
            }
        }
        @keyframes arrowBounce {
            0%, 100% { transform: translateX(0); }
            50%      { transform: translateX(-4px); }
        }

        /* ریسپانسیو */
        @media (max-width: 360px) {
            .app-container { padding-inline: 19px; }
            .hero-section { padding-block: 24px 22px; }
            .main-title { font-size: 2.45rem; }
            .btn-primary { min-height: 62px; font-size: 1.08rem; }
            .bottom-section { gap: 17px; }
            .marquee-wrapper { min-height: 53px; }
            .marquee-item { font-size: .83rem; padding: 0 18px; }
        }

        @media (max-height: 720px) {
            .app-container {
                padding-top: max(14px, env(safe-area-inset-top));
                padding-bottom: max(14px, env(safe-area-inset-bottom));
            }
            .hero-section { min-height: 260px; padding-block: 18px; }
            .main-title { font-size: clamp(2.3rem, 9vw, 3rem); margin-bottom: 18px; }
            .subtitle { font-size: 1.08rem; }
            .features { font-size: .9rem; }
            .bottom-section { gap: 15px; }
            .btn-primary { min-height: 59px; padding-block: 12px; }
            .marquee-wrapper { margin-top: 8px; min-height: 50px; }
        }

        @media (max-width: 480px) {
            .app-container { padding-inline: 16px; width: 100%; max-width: 100%; }
            .main-title { font-size: clamp(2.2rem, 10vw, 3rem); }
            .hero-section { min-height: auto; padding: 22px 0 20px; }
            .btn-primary { font-size: 1.05rem; min-height: 60px; padding: 14px 18px; }
            .register-link { font-size: .9rem; }
            .marquee-item { padding: 0 18px; font-size: .85rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader-ring"></div>
        <div class="loader-text">در حال بارگذاری...</div>
    </div>

    <div class="dynamic-bg" aria-hidden="true"></div>
    <div class="bg-overlay" aria-hidden="true"></div>

    <main class="app-container">
        <div class="ambient-glow one" aria-hidden="true"></div>
        <div class="ambient-glow two" aria-hidden="true"></div>

        <section class="hero-section" aria-labelledby="page-title">
            <h1 class="main-title" id="page-title">باشگاه<br>دانشجومعلمان</h1>
            <p class="subtitle">یاد بگیر، رقابت کن، بدرخش</p>
            <p class="features">آموزش <span aria-hidden="true">•</span> آزمون <span aria-hidden="true">•</span> تعامل <span aria-hidden="true">•</span> پیشرفت</p>
        </section>

        <section class="bottom-section" aria-label="ورود و ثبت‌نام">
            <a href="{% url 'accounts:login_step1' %}" class="btn-primary">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 5 20 12l-7 7M20 12H4"/>
                </svg>
                <span>ورود به باشگاه</span>
            </a>

            <a href="{% url 'accounts:register_step1' %}" class="register-link">
                حساب کاربری ندارید؟ <span>ثبت نام کنید</span>
            </a>

            <!-- MARQUEE ساختار جدید -->
            <div class="marquee-wrapper" aria-label="اطلاعیه‌های باشگاه">
                <div class="marquee-fade left" aria-hidden="true"></div>
                <div class="marquee-fade right" aria-hidden="true"></div>
                <div class="marquee-track" id="marqueeTrack"></div>
            </div>
        </section>
    </main>

    <script>
        (() => {
            const messages = [
                "به باشگاه دانشجومعلمان خوش آمدید",
                "🏆 به برنده‌های مسابقات جایزه نقدی اهدا می‌شود",
                "📚 هزاران سؤال و آزمون طبقه‌بندی‌شده در انتظار شماست",
                "🎓 با شرکت در آزمون‌ها، مهارت‌های خود را ارتقا دهید"
            ];

            const track = document.getElementById("marqueeTrack");
            if (!track) return;

            // ساخت یک گروه کامل از پیام‌ها
            function buildGroup(hidden) {
                const group = document.createElement("div");
                group.className = "marquee-group";
                if (hidden) group.setAttribute("aria-hidden", "true");

                messages.forEach((message) => {
                    const item = document.createElement("div");
                    item.className = "marquee-item";

                    const spark = document.createElement("span");
                    spark.className = "spark";
                    spark.setAttribute("aria-hidden", "true");
                    spark.textContent = "✦";

                    const text = document.createElement("span");
                    text.textContent = message;

                    item.append(spark, text);
                    group.appendChild(item);
                });
                return group;
            }

            // دو گروه دقیقاً یکسان: گروه دوم فقط برای تکمیل حلقه
            track.appendChild(buildGroup(false));
            track.appendChild(buildGroup(true));
        })();

        // لودینگ
        window.addEventListener('load', () => {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) setTimeout(() => overlay.classList.add('hidden'), 600);
        });

        setTimeout(() => {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay && !overlay.classList.contains('hidden')) {
                overlay.classList.add('hidden');
            }
        }, 5000);
    </script>
</body>
</html>
