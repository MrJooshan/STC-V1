<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#dceefc">
    <meta name="color-scheme" content="light">
    <title>{{ setting.site_title|default:"باشگاه دانشجومعلمان" }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #10264b;
            --blue: #087cff;
            --page-width: 480px;
            --btn-radius: 999px;
            --skeleton-base: #d7e6f4;
            --skeleton-shine: #eaf3fb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Vazirmatn", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
            background: #dceefc;
            color-scheme: light;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--ink);
            background:
                radial-gradient(ellipse at 50% 8%, rgba(255,255,255,.85), transparent 52%),
                linear-gradient(145deg, #eef7ff 0%, #dceefc 48%, #ddfaf2 100%);
            display: flex;
            justify-content: center;
            overflow: hidden;
            overscroll-behavior: none;
        }

        /* ============================================================
           APP SHELL
           ============================================================ */
        .app-shell {
            position: relative;
            width: 100%;
            max-width: var(--page-width);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            isolation: isolate;
            background: #e3f0fb;
        }

        /* ============================================================
           SKELETON LOADING
           نسخه‌ی خاکستری پالس‌دار از ساختار صفحه
           ============================================================ */
        .skeleton-overlay {
            position: absolute;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 50% 40%, #f4fbff 0%, #e2f1fd 60%, #d6ecfb 100%);
            transition: opacity 0.6s ease, visibility 0.6s ease;
            padding:
                max(24px, env(safe-area-inset-top))
                clamp(16px, 5vw, 25px)
                max(22px, env(safe-area-inset-bottom));
        }

        .skeleton-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .sk {
            position: relative;
            overflow: hidden;
            background: var(--skeleton-base);
            border-radius: 12px;
            isolation: isolate;
        }

        .sk::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                var(--skeleton-shine) 50%,
                transparent 100%
            );
            transform: translateX(-100%);
            animation: skShine 1.6s ease-in-out infinite;
        }

        @keyframes skShine {
            0%   { transform: translateX(-100%); }
            60%  { transform: translateX(100%); }
            100% { transform: translateX(100%); }
        }

        /* ساختار اسکلت — شبیه به خود صفحه */
        .sk-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .sk-hero {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 0 28px;
            gap: 14px;
        }

        .sk-title {
            width: 72%;
            height: 46px;
            border-radius: 14px;
        }
        .sk-title-2 {
            width: 58%;
            height: 46px;
            border-radius: 14px;
            margin-top: -4px;
        }
        .sk-divider {
            width: 68%;
            height: 4px;
            border-radius: 10px;
            margin: 6px 0 8px;
        }
        .sk-subtitle {
            width: 46%;
            height: 22px;
            border-radius: 10px;
        }
        .sk-features {
            width: 62%;
            height: 16px;
            border-radius: 8px;
            margin-top: 4px;
        }

        .sk-bottom {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }

        .sk-btn {
            width: 100%;
            height: 68px;
            border-radius: var(--btn-radius);
        }
        .sk-link {
            width: 55%;
            height: 16px;
            border-radius: 8px;
        }
        .sk-marquee {
            width: 100%;
            height: 58px;
            border-radius: var(--btn-radius);
        }

        /* ============================================================
           پس‌زمینه و محتوای اصلی (بدون تغییر)
           ============================================================ */
        .dynamic-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background-color: #e3f0fb;
            background-image:
                {% if setting.background_image %}
                url('{{ setting.background_image.url }}'),
                {% endif %}
                radial-gradient(circle at 82% 13%, rgba(30, 174, 255, .18), transparent 31%),
                radial-gradient(circle at 12% 80%, rgba(0, 211, 177, .15), transparent 32%),
                linear-gradient(155deg, #f4fbff 0%, #e2f1fd 55%, #e4faf2 100%);
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: local;
            pointer-events: none;
        }

        .bg-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,.02) 0%, rgba(255,255,255,.06) 50%, rgba(220,238,252,.18) 100%),
                radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(255,255,255,.08) 100%);
        }

        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding:
                max(24px, env(safe-area-inset-top))
                clamp(16px, 5vw, 25px)
                max(22px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.loaded .app-container { opacity: 1; }

        .ambient-glow {
            position: absolute;
            z-index: 0;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            filter: blur(42px);
            opacity: .22;
            pointer-events: none;
        }
        .ambient-glow.one { top: 13%; right: -115px; background: #38bdf8; }
        .ambient-glow.two { bottom: 10%; left: -120px; background: #18d6b0; }

        /* ===================== هیرو ===================== */
        .hero-section {
            flex: 1 0 auto;
            width: 100%;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 0 28px;
        }

        .main-title {
            position: relative;
            font-family: "Lalezar", "Vazirmatn", sans-serif;
            font-size: clamp(2.4rem, 10vw, 3.5rem);
            font-weight: 400;
            line-height: 1.3;
            letter-spacing: -.3px;
            margin-bottom: 26px;
            color: #f8c02e;
            text-align: center;
            text-shadow:
                -1px -1px 0 #1a1a1a,
                 1px -1px 0 #1a1a1a,
                -1px  1px 0 #1a1a1a,
                 1px  1px 0 #1a1a1a,
                 0   -2px 0 #1a1a1a,
                 0    2px 0 #1a1a1a,
                -2px  0   0 #1a1a1a,
                 2px  0   0 #1a1a1a,
                 0  3px 0 #141414,
                 0  5px 0 #0f0f0f,
                 0  7px 0 #0a0a0a,
                 0  9px 0 #050505,
                 0 12px 14px rgba(0, 0, 0, 0.35);
            animation: fadeInUp .9s cubic-bezier(.16, 1, .3, 1) .08s both;
            -webkit-font-smoothing: antialiased;
            max-width: 100%;
            word-break: break-word;
        }

        .main-title::after {
            content: "";
            display: block;
            width: 68%;
            height: 3px;
            margin: 16px auto 0;
            border-radius: 10px;
            background: linear-gradient(90deg, transparent, #1a1a1a 20%, #f8c02e 50%, #1a1a1a 80%, transparent);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: #1a1a1a;
            font-size: clamp(1.05rem, 4.2vw, 1.38rem);
            font-weight: 900;
            line-height: 1.8;
            margin-bottom: 7px;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.9);
            animation: fadeInUp .9s cubic-bezier(.16, 1, .3, 1) .22s both;
        }

        .features {
            color: #2a2a2a;
            font-size: clamp(.88rem, 3.5vw, 1.05rem);
            font-weight: 800;
            line-height: 1.9;
            text-shadow: 0 1px 5px rgba(255, 255, 255, 0.95);
            animation: fadeInUp .9s cubic-bezier(.16, 1, .3, 1) .36s both;
        }

        .features span { color: var(--blue); margin: 0 2px; }

        /* ===================== پایین ===================== */
        .bottom-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding-bottom: 5px;
            animation: fadeInUp .9s cubic-bezier(.16, 1, .3, 1) .5s both;
        }

        .btn-primary {
            position: relative;
            isolation: isolate;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 68px;
            padding: 16px 22px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.75);
            border-radius: var(--btn-radius);
            background: linear-gradient(180deg, #36c5ff 0%, #0d7cf5 40%, #00d8b0 100%);
            color: #fff;
            text-decoration: none;
            font-size: clamp(1rem, 3.6vw, 1.2rem);
            font-weight: 900;
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.08),
                0 13px 28px rgba(0, 139, 221, 0.35),
                0 4px 12px rgba(0, 199, 183, 0.25),
                inset 0 2px 4px rgba(255, 255, 255, 0.7),
                inset 0 -6px 12px rgba(0, 70, 130, 0.35),
                0 0 30px rgba(0, 180, 255, 0.25);
            transition: transform .22s ease, box-shadow .22s ease, filter .22s ease;
            animation: btnGlow 3s ease-in-out infinite;
        }

        .btn-primary svg {
            width: 26px;
            height: 26px;
            flex: 0 0 auto;
            stroke: currentColor;
            stroke-width: 2.6;
            order: -1;
            animation: arrowBounce 2.4s ease-in-out infinite;
        }

        .btn-primary span {
            letter-spacing: .5px;
            text-shadow: 0 2px 3px rgba(0, 60, 100, 0.3);
        }

        .btn-primary::before {
            content: "";
            position: absolute;
            z-index: -1;
            top: -10%;
            inset-inline-end: -35%;
            width: 55%;
            height: 200%;
            transform: rotate(28deg);
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: inset-inline-end .55s ease;
            filter: blur(2px);
        }

        .btn-primary::after {
            content: "";
            position: absolute;
            top: 5px;
            inset-inline-start: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
            border-radius: 50%;
            opacity: 0.8;
        }

        .btn-primary:hover {
            filter: saturate(1.15) brightness(1.05);
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.1),
                0 16px 34px rgba(0, 139, 221, 0.4),
                0 5px 15px rgba(0, 199, 183, 0.3),
                inset 0 2px 4px rgba(255, 255, 255, 0.8),
                inset 0 -6px 12px rgba(0, 70, 130, 0.4),
                0 0 50px rgba(0, 200, 255, 0.35);
        }

        .btn-primary:hover::before { inset-inline-end: 115%; }
        .btn-primary:active { transform: scale(.97) translateY(1px); }

        .btn-primary:focus-visible,
        .register-link:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 3px;
            border-radius: var(--btn-radius);
        }

        .register-link {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            width: 100%;
            color: #1a1a1a;
            text-decoration: none;
            text-align: center;
            font-size: clamp(.88rem, 3.4vw, .98rem);
            font-weight: 800;
            line-height: 1.8;
            text-shadow: 0 1px 5px rgba(255, 255, 255, 0.95);
        }

        .register-link::before,
        .register-link::after {
            content: "";
            flex: 1 1 18px;
            min-width: 12px;
            max-width: 58px;
            height: 2px;
            border-radius: 5px;
            background: linear-gradient(90deg, transparent, rgba(20, 40, 80, 0.35));
        }
        .register-link::after { transform: rotate(180deg); }

        .register-link span {
            color: #d81b74;
            font-weight: 900;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.9);
        }
        .register-link:hover span { color: #a8125a; }

        /* ============================================================
           MARQUEE
           ============================================================ */
        .marquee-wrapper {
            position: relative;
            width: 100%;
            min-height: 58px;
            margin-top: clamp(10px, 2.5vh, 22px);
            display: flex;
            align-items: center;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.75);
            border-radius: var(--btn-radius);
            background: linear-gradient(180deg, #9b4ddb 0%, #6a2caf 45%, #4a1a8a 100%);
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.05),
                0 10px 28px rgba(77, 36, 143, 0.3),
                inset 0 2px 2px rgba(255, 255, 255, 0.5),
                inset 0 -5px 10px rgba(30, 10, 60, 0.4),
                0 0 25px rgba(130, 60, 200, 0.2);
            direction: ltr;
        }

        .marquee-wrapper::before,
        .marquee-wrapper::after {
            content: "";
            position: absolute;
            left: 10%;
            right: 10%;
            height: 1px;
            z-index: 2;
            pointer-events: none;
            border-radius: 50%;
        }
        .marquee-wrapper::before {
            top: 3px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
        }
        .marquee-wrapper::after {
            bottom: 3px;
            left: 15%;
            right: 15%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        .marquee-fade {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 30px;
            z-index: 3;
            pointer-events: none;
        }
        .marquee-fade.left  { left: 0;  background: linear-gradient(90deg,  #7a35bd, transparent); }
        .marquee-fade.right { right: 0; background: linear-gradient(270deg, #5a2599, transparent); }

        .marquee-track {
            display: flex;
            flex-wrap: nowrap;
            width: max-content;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .marquee-group {
            display: flex;
            flex-wrap: nowrap;
            flex: 0 0 auto;
            width: max-content;
            direction: rtl;
        }

        .marquee-item {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
            padding: 0 25px;
            color: #ffffff;
            font-size: clamp(.82rem, 3vw, .91rem);
            font-weight: 700;
            white-space: nowrap;
            text-shadow:
                0 1px 0 #3a1060,
                0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .marquee-item .spark {
            color: #ffd966;
            font-size: 1.1rem;
            flex: 0 0 auto;
            filter: drop-shadow(0 0 6px rgba(255, 220, 120, 0.7));
        }

        /* انیمیشن‌های عمومی */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes btnGlow {
            0%, 100% {
                box-shadow:
                    0 0 0 1px rgba(0, 0, 0, 0.08),
                    0 13px 28px rgba(0, 139, 221, 0.35),
                    0 4px 12px rgba(0, 199, 183, 0.25),
                    inset 0 2px 4px rgba(255, 255, 255, 0.7),
                    inset 0 -6px 12px rgba(0, 70, 130, 0.35),
                    0 0 30px rgba(0, 180, 255, 0.25);
            }
            50% {
                box-shadow:
                    0 0 0 1px rgba(0, 0, 0, 0.08),
                    0 13px 28px rgba(0, 139, 221, 0.45),
                    0 4px 12px rgba(0, 199, 183, 0.35),
                    inset 0 2px 4px rgba(255, 255, 255, 0.75),
                    inset 0 -6px 12px rgba(0, 70, 130, 0.4),
                    0 0 45px rgba(0, 200, 255, 0.45);
            }
        }
        @keyframes arrowBounce {
            0%, 100% { transform: translateX(0); }
            50%      { transform: translateX(-4px); }
        }

        /* ===================== ریسپانسیو ===================== */
        @media (max-width: 360px) {
            .app-container { padding-inline: 14px; }
            .skeleton-overlay { padding-inline: 14px; }
            .hero-section { padding-block: 22px 20px; }
            .main-title { font-size: 2.3rem; }
            .btn-primary { min-height: 60px; font-size: 1rem; }
            .bottom-section { gap: 16px; }
            .marquee-wrapper { min-height: 52px; }
            .marquee-item { font-size: .8rem; padding: 0 16px; }
            .sk-btn { height: 60px; }
            .sk-marquee { height: 52px; }
        }

        @media (max-height: 720px) {
            .app-container {
                padding-top: max(14px, env(safe-area-inset-top));
                padding-bottom: max(14px, env(safe-area-inset-bottom));
            }
            .hero-section { min-height: 240px; padding-block: 16px; }
            .main-title { font-size: clamp(2.1rem, 8.5vw, 2.9rem); margin-bottom: 16px; }
            .subtitle { font-size: 1.02rem; }
            .features { font-size: .86rem; }
            .bottom-section { gap: 14px; }
            .btn-primary { min-height: 58px; padding-block: 12px; }
            .marquee-wrapper { margin-top: 6px; min-height: 48px; }
            .sk-hero { padding-block: 16px; gap: 10px; }
            .sk-title, .sk-title-2 { height: 36px; }
            .sk-btn { height: 58px; }
            .sk-marquee { height: 48px; }
        }

        @media (max-width: 480px) {
            .app-container { padding-inline: 16px; }
            .skeleton-overlay { padding-inline: 16px; }
            .hero-section { min-height: auto; padding: 22px 0 20px; }
            .btn-primary { min-height: 60px; padding: 14px 18px; }
            .marquee-item { padding: 0 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
            .sk::after { animation: none !important; }
        }
    </style>
</head>
<body>

    <div class="app-shell">

        <!-- ============================================================
             SKELETON LOADING — نسخه‌ی خاکستری پالس‌دار از ساختار صفحه
             ============================================================ -->
        <div class="skeleton-overlay" id="skeletonOverlay" role="status" aria-live="polite" aria-label="در حال بارگذاری">
            <div class="sk-wrap" aria-hidden="true">
                <div class="sk-hero">
                    <div class="sk sk-title"></div>
                    <div class="sk sk-title-2"></div>
                    <div class="sk sk-divider"></div>
                    <div class="sk sk-subtitle"></div>
                    <div class="sk sk-features"></div>
                </div>
                <div class="sk-bottom">
                    <div class="sk sk-btn"></div>
                    <div class="sk sk-link"></div>
                    <div class="sk sk-marquee"></div>
                </div>
            </div>
        </div>

        <div class="dynamic-bg" aria-hidden="true"></div>
        <div class="bg-overlay" aria-hidden="true"></div>

        <main class="app-container" aria-labelledby="page-title">
            <div class="ambient-glow one" aria-hidden="true"></div>
            <div class="ambient-glow two" aria-hidden="true"></div>

            <section class="hero-section">
                <h1 class="main-title" id="page-title">باشگاه<br>دانشجومعلمان</h1>
                <p class="subtitle">یاد بگیر، رقابت کن، بدرخش</p>
                <p class="features">آموزش <span aria-hidden="true">•</span> آزمون <span aria-hidden="true">•</span> تعامل <span aria-hidden="true">•</span> پیشرفت</p>
            </section>

            <section class="bottom-section" aria-label="ورود و ثبت‌نام">
                <a href="{% url 'accounts:login_step1' %}" class="btn-primary" aria-label="ورود به باشگاه">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 5 20 12l-7 7M20 12H4"/>
                    </svg>
                    <span>ورود به باشگاه</span>
                </a>

                <a href="{% url 'accounts:register_step1' %}" class="register-link">
                    حساب کاربری ندارید؟ <span>ثبت نام کنید</span>
                </a>

                <div class="marquee-wrapper" id="marqueeWrapper" aria-label="اطلاعیه‌های باشگاه">
                    <div class="marquee-fade left" aria-hidden="true"></div>
                    <div class="marquee-fade right" aria-hidden="true"></div>
                    <div class="marquee-track" id="marqueeTrack"></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        /* ============================================================
           MARQUEE
           ============================================================ */
        (() => {
            const messages = [
                "به باشگاه دانشجومعلمان خوش آمدید",
                "🏆 به برنده‌های مسابقات جایزه نقدی اهدا می‌شود",
                "📚 هزاران سؤال و آزمون طبقه‌بندی‌شده در انتظار شماست",
                "🎓 با شرکت در آزمون‌ها، مهارت‌های خود را ارتقا دهید"
            ];

            const track = document.getElementById("marqueeTrack");
            const wrapper = document.getElementById("marqueeWrapper");
            if (!track || !wrapper) return;

            function buildGroup(hidden) {
                const group = document.createElement("div");
                group.className = "marquee-group";
                if (hidden) group.setAttribute("aria-hidden", "true");
                messages.forEach((message) => {
                    const item = document.createElement("div");
                    item.className = "marquee-item";
                    const spark = document.createElement("span");
                    spark.className = "spark";
                    spark.setAttribute("aria-hidden", "true");
                    spark.textContent = "✦";
                    const text = document.createElement("span");
                    text.textContent = message;
                    item.append(spark, text);
                    group.appendChild(item);
                });
                return group;
            }

            const g1 = buildGroup(false);
            const g2 = buildGroup(true);
            track.appendChild(g1);
            track.appendChild(g2);

            let groupWidth = 0;
            let offset = 0;
            let lastTime = 0;
            let paused = false;
            const SPEED = 60;

            const measure = () => {
                const w = g1.getBoundingClientRect().width;
                if (w > 0) groupWidth = w;
            };

            const tick = (time) => {
                if (!lastTime) lastTime = time;
                const dt = Math.min((time - lastTime) / 1000, 0.05);
                lastTime = time;

                if (!paused && groupWidth > 0) {
                    offset -= SPEED * dt;
                    if (offset <= -groupWidth) offset += groupWidth;
                    track.style.transform = `translate3d(${offset}px, 0, 0)`;
                }
                requestAnimationFrame(tick);
            };

            requestAnimationFrame(() => {
                measure();
                requestAnimationFrame(tick);
            });

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(measure);
            }
            window.addEventListener("resize", measure, { passive: true });
            window.addEventListener("orientationchange", () => setTimeout(measure, 150));

            wrapper.addEventListener("mouseenter", () => { paused = true; });
            wrapper.addEventListener("mouseleave", () => { paused = false; });
            wrapper.addEventListener("focusin", () => { paused = true; });
            wrapper.addEventListener("focusout", () => { paused = false; });

            if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                paused = true;
            }
        })();

        /* ============================================================
           SKELETON — بستن پس از load یا fallback
           ============================================================ */
        (() => {
            const overlay = document.getElementById("skeletonOverlay");
            if (!overlay) return;
            let closed = false;
            const close = () => {
                if (closed) return;
                closed = true;
                overlay.classList.add("hidden");
                document.body.classList.add("loaded");
            };
            window.addEventListener("load", () => setTimeout(close, 700));
            setTimeout(close, 5000);
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible" && document.readyState === "complete") {
                    setTimeout(close, 200);
                }
            });
        })();
    </script>
</body>
</html>
