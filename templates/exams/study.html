<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>مطالعه | {{ exam.title }}</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:#10264b; --blue:#087cff; --teal:#00d6ae; --gold:#f8c02e;
            --pink:#d81b74; --muted:#526783;
            --grad-btn:linear-gradient(135deg,#36c5ff 0%,#0d7cf5 45%,#00d8b0 100%);
            --radius-btn:999px; --page-width:420px;
        }
        *{box-sizing:border-box;margin:0;padding:0;font-family:"Vazirmatn",sans-serif;-webkit-tap-highlight-color:transparent;}
        html,body{height:100%;}
        body{min-height:100vh;min-height:100svh;background:#000;display:flex;justify-content:center;align-items:stretch;overflow:hidden;}
        .mobile-shell{position:relative;width:100%;max-width:var(--page-width);min-height:100vh;min-height:100svh;background:#f5f9ff;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;}
        .soft-glow{position:absolute;z-index:0;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(8,124,255,.20) 0%,rgba(8,124,255,.06) 45%,transparent 70%);filter:blur(24px);top:-120px;right:-120px;pointer-events:none;animation:glowFloat 8s ease-in-out infinite;}
        .soft-glow-bottom{position:absolute;z-index:0;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(0,214,174,.16) 0%,rgba(0,214,174,.04) 45%,transparent 70%);filter:blur(26px);bottom:-110px;left:-110px;pointer-events:none;animation:glowFloat 10s ease-in-out infinite reverse;}
        @keyframes glowFloat{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-10px,10px) scale(1.08);}}
        .top-header{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:max(14px,env(safe-area-inset-top)) 20px 6px;flex:0 0 auto;}
        .back-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--blue);text-decoration:none;border:1px solid rgba(8,124,255,.12);box-shadow:0 4px 14px rgba(16,38,75,.08);transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .3s ease,color .3s ease,box-shadow .3s ease;position:relative;overflow:hidden;flex-shrink:0;}
        .back-btn::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--grad-btn);opacity:0;transition:opacity .3s ease;z-index:0;}
        .back-btn svg{width:18px;height:18px;position:relative;z-index:1;transform:translateX(-2px);transition:transform .3s ease;}
        .back-btn:hover{color:#fff;transform:translateY(-2px) scale(1.06);box-shadow:0 8px 22px rgba(8,124,255,.28);}
        .back-btn:hover::before{opacity:1;}
        .back-btn:hover svg{transform:translateX(-4px);}
        .back-btn:active{transform:scale(.94);}
        .page-indicator{font-size:.8rem;font-weight:800;color:var(--muted);padding:6px 14px;background:#fff;border-radius:999px;border:1px solid rgba(8,124,255,.10);box-shadow:0 2px 8px rgba(16,38,75,.04);}
        .content{position:relative;z-index:1;flex:1 1 auto;display:flex;flex-direction:column;padding:4px 20px max(16px,env(safe-area-inset-bottom));overflow-y:auto;scrollbar-width:none;min-height:0;}
        .content::-webkit-scrollbar{display:none;}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
        .progress-bar{height:7px;background:rgba(8,124,255,.10);border-radius:999px;overflow:hidden;margin:6px 0 18px;box-shadow:inset 0 1px 3px rgba(16,38,75,.08);}
        .progress-fill{height:100%;background:var(--grad-btn);border-radius:999px;transition:width .5s cubic-bezier(.16,1,.3,1);width:{% widthratio page.page_number total_pages 100 %}%;box-shadow:0 0 10px rgba(8,124,255,.5);position:relative;}
        .progress-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shine 2s ease-in-out infinite;}
        @keyframes shine{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
        .content-card{background:#fff;border-radius:22px;padding:24px 22px;box-shadow:0 8px 28px rgba(16,38,75,.07);flex:1;overflow:hidden;word-wrap:break-word;overflow-wrap:break-word;border:1px solid rgba(8,124,255,.06);animation:fadeInUp .5s ease .05s both;position:relative;}
        .content-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--grad-btn);border-radius:22px 22px 0 0;}
        .page-title{font-family:"Lalezar","Vazirmatn",sans-serif;font-size:1.5rem;font-weight:400;margin-bottom:16px;color:var(--ink);word-wrap:break-word;letter-spacing:-.3px;}
        .page-content{font-size:.95rem;line-height:2.05;color:#333;text-align:justify;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;word-break:break-word;max-width:100%;font-weight:500;}
        .nav-buttons{display:flex;gap:10px;margin-top:16px;animation:fadeInUp .5s ease .15s both;flex:0 0 auto;}
        .nav-btn{flex:1;padding:15px;border-radius:var(--radius-btn);text-decoration:none;text-align:center;font-weight:900;font-size:.92rem;transition:all .3s ease;display:flex;align-items:center;justify-content:center;gap:6px;}
        .btn-next{background:var(--grad-btn);color:#fff;box-shadow:0 8px 22px rgba(0,139,221,.35),inset 0 2px 4px rgba(255,255,255,.4),inset 0 -3px 8px rgba(0,70,130,.2);}
        .btn-next:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,139,221,.45);}
        .btn-prev{background:#fff;border:1.5px solid rgba(8,124,255,.12);color:var(--ink);box-shadow:0 4px 14px rgba(16,38,75,.06);}
        .btn-prev:hover{background:#f8fbff;border-color:rgba(8,124,255,.3);transform:translateY(-2px);}
        .btn-quiz{background:linear-gradient(135deg,#00d6ae,#00b894);color:#fff;box-shadow:0 8px 22px rgba(0,214,174,.4),inset 0 2px 4px rgba(255,255,255,.4),inset 0 -3px 8px rgba(0,100,80,.2);}
        .btn-quiz:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,214,174,.5);}
        .nav-btn:active{transform:scale(.97);}
        @media(max-height:700px){
            .top-header{padding-top:max(10px,env(safe-area-inset-top));}
            .page-indicator{font-size:.74rem;padding:5px 12px;}
            .content-card{padding:18px 16px;}
            .page-title{font-size:1.3rem;margin-bottom:12px;}
            .page-content{font-size:.9rem;line-height:1.9;}
            .nav-btn{padding:13px;font-size:.85rem;}
        }
        @media(max-width:380px){
            .content{padding-inline:16px;}
            .top-header{padding-inline:16px;}
        }
        @media(prefers-reduced-motion:reduce){
            *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
            .progress-fill::after{animation:none;}
        }
    </style>
</head>
<body>
    <div class="mobile-shell">
        <div class="soft-glow" aria-hidden="true"></div>
        <div class="soft-glow-bottom" aria-hidden="true"></div>

        <header class="top-header">
            <a href="{% url 'exams:detail' exam.pk %}" class="back-btn" aria-label="بازگشت">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="M9 5l7 7-7 7"/></svg>
            </a>
            <div class="page-indicator">صفحه {{ page.page_number }} از {{ total_pages }}</div>
            <div style="width:42px;"></div>
        </header>

        <main class="content">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <div class="content-card">
                {% if page.title %}<h2 class="page-title">{{ page.title }}</h2>{% endif %}
                <div class="page-content">{{ page.content }}</div>
            </div>

            <div class="nav-buttons">
                {% if prev_page_num >= 1 %}
                    <a href="{% url 'exams:study_page' exam.pk prev_page_num %}" class="nav-btn btn-prev">← قبلی</a>
                {% endif %}
                {% if is_last_page %}
                    <a href="{% url 'exams:take' exam.pk %}" class="nav-btn btn-quiz">شروع آزمون 🚀</a>
                {% else %}
                    <a href="{% url 'exams:study_page' exam.pk next_page_num %}" class="nav-btn btn-next">صفحه بعدی →</a>
                {% endif %}
            </div>
        </main>
    </div>
</body>
</html>
