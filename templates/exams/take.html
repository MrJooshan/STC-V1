<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>آزمون | {{ exam.title }}</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:#10264b; --blue:#087cff; --teal:#00d6ae; --gold:#f8c02e;
            --pink:#d81b74; --muted:#526783;
            --grad-btn:linear-gradient(135deg,#36c5ff 0%,#0d7cf5 45%,#00d8b0 100%);
            --radius-btn:999px; --page-width:420px;
        }
        *{box-sizing:border-box;margin:0;padding:0;font-family:"Vazirmatn",sans-serif;-webkit-tap-highlight-color:transparent;}
        html,body{height:100%;}
        body{min-height:100vh;min-height:100svh;background:#f5f9ff;display:flex;justify-content:center;align-items:stretch;padding:90px 0 110px;overflow-x:hidden;}
        .app-container{width:100%;max-width:var(--page-width);padding:0 20px;}
        .timer-bar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--page-width);background:#fff;border-bottom:1px solid rgba(8,124,255,.10);padding:max(12px,env(safe-area-inset-top)) 20px 12px;display:flex;justify-content:space-between;align-items:center;z-index:100;box-shadow:0 4px 18px rgba(16,38,75,.08);}
        .timer-bar::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--grad-btn);opacity:.7;}
        .timer-label-sm{font-size:.7rem;color:var(--muted);font-weight:700;margin-bottom:3px;}
        .timer-display{font-family:"Lalezar","Vazirmatn",sans-serif;font-size:1.5rem;color:var(--ink);font-weight:400;line-height:1;letter-spacing:1px;}
        .timer-display.warning{color:var(--pink);animation:pulse 1s infinite;}
        @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
        .exam-meta{font-size:.78rem;color:var(--muted);text-align:left;font-weight:600;}
        .exam-meta strong{display:block;font-weight:800;color:var(--ink);margin-bottom:2px;font-size:.82rem;}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
        .question-card{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 6px 20px rgba(16,38,75,.06);border:1px solid rgba(8,124,255,.06);animation:fadeInUp .5s cubic-bezier(.16,1,.3,1) both;position:relative;overflow:hidden;}
        .question-card::before{content:'';position:absolute;top:0;right:0;bottom:0;width:3px;background:var(--grad-btn);opacity:.6;}
        .question-card:nth-child(1){animation-delay:.05s;}
        .question-card:nth-child(2){animation-delay:.10s;}
        .question-card:nth-child(3){animation-delay:.15s;}
        .question-card:nth-child(4){animation-delay:.20s;}
        .question-card:nth-child(5){animation-delay:.25s;}
        .question-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
        .question-number{width:34px;height:34px;background:var(--grad-btn);border-radius:11px;display:flex;justify-content:center;align-items:center;font-weight:900;font-size:.9rem;color:#fff;box-shadow:0 4px 12px rgba(8,124,255,.3);flex-shrink:0;}
        .question-points{font-size:.72rem;color:var(--muted);font-weight:700;padding:4px 10px;background:rgba(248,192,46,.12);color:#b8860b;border-radius:999px;}
        .question-text{font-size:.95rem;font-weight:800;margin-bottom:14px;line-height:1.8;color:var(--ink);}
        .options{display:flex;flex-direction:column;gap:8px;}
        .option{position:relative;}
        .option input{position:absolute;opacity:0;pointer-events:none;}
        .option label{display:flex;align-items:center;gap:10px;padding:13px 15px;background:#f8fbff;border:2px solid rgba(8,124,255,.10);border-radius:14px;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);font-size:.9rem;color:var(--ink);font-weight:600;}
        .option label:hover{background:rgba(8,124,255,.06);border-color:rgba(8,124,255,.25);}
        .option input:checked + label{background:rgba(8,124,255,.08);border-color:var(--blue);font-weight:800;box-shadow:0 4px 14px rgba(8,124,255,.15);}
        .option-circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:flex;justify-content:center;align-items:center;flex-shrink:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);}
        .option input:checked + label .option-circle{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 4px #fff;transform:scale(1.1);}
        .submit-btn{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:380px;padding:17px;background:var(--grad-btn);color:#fff;border:none;border-radius:var(--radius-btn);font-size:1.05rem;font-weight:900;cursor:pointer;box-shadow:0 12px 30px rgba(0,139,221,.4),inset 0 2px 4px rgba(255,255,255,.4),inset 0 -4px 10px rgba(0,70,130,.2);transition:transform .22s ease,box-shadow .22s ease,filter .22s ease;position:fixed;overflow:hidden;z-index:100;}
        .submit-btn::before{content:'';position:absolute;top:-10%;right:-35%;width:55%;height:200%;transform:rotate(28deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transition:right .55s ease;filter:blur(2px);}
        .submit-btn:hover{filter:saturate(1.12) brightness(1.05);transform:translateX(-50%) translateY(-2px);box-shadow:0 16px 36px rgba(0,139,221,.5);}
        .submit-btn:hover::before{right:115%;}
        .submit-btn:active{transform:translateX(-50%) scale(.97);}
        @media(max-height:700px){
            body{padding:78px 0 96px;}
            .timer-bar{padding-top:max(10px,env(safe-area-inset-top));padding-bottom:10px;}
            .timer-display{font-size:1.3rem;}
            .question-card{padding:16px;}
            .option label{padding:11px 13px;}
            .submit-btn{padding:15px;font-size:.95rem;}
        }
        @media(max-width:380px){
            .app-container{padding-inline:16px;}
            .timer-bar{padding-inline:16px;}
        }
        @media(prefers-reduced-motion:reduce){
            *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
        }
    </style>
</head>
<body>
    <div class="timer-bar">
        <div>
            <div class="timer-label-sm">زمان باقی‌مانده</div>
            <div class="timer-display" id="timer">{{ exam.time_limit }}:00</div>
        </div>
        <div class="exam-meta">
            <strong>{{ exam.title }}</strong>
            <div>{{ questions.count }} سوال</div>
        </div>
    </div>

    <div class="app-container">
        <form method="POST" id="exam-form">
            {% csrf_token %}
            {% for question in questions %}
                <div class="question-card">
                    <div class="question-header">
                        <div class="question-number">{{ forloop.counter }}</div>
                        <div class="question-points">{{ question.points }} امتیاز</div>
                    </div>
                    <div class="question-text">{{ question.question_text }}</div>
                    <div class="options">
                        {% for option_num, option_text in question.get_options %}
                            <div class="option">
                                <input type="radio" name="question_{{ question.id }}" id="q{{ question.id }}_opt{{ option_num }}" value="{{ option_num }}" required>
                                <label for="q{{ question.id }}_opt{{ option_num }}">
                                    <span class="option-circle"></span>
                                    {{ option_text }}
                                </label>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            {% endfor %}
            <button type="submit" class="submit-btn">ثبت و پایان آزمون</button>
        </form>
    </div>

    <script>
        let minutes = {{ exam.time_limit }};
        let seconds = 0;
        const timerEl = document.getElementById('timer');
        const form = document.getElementById('exam-form');
        function updateTimer() {
            if (seconds === 0) {
                if (minutes === 0) { timerEl.textContent = '00:00'; form.submit(); return; }
                minutes--; seconds = 59;
            } else { seconds--; }
            timerEl.textContent = String(minutes).padStart(2,'0') + ':' + String(seconds).padStart(2,'0');
            if (minutes < 1) timerEl.classList.add('warning');
        }
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
